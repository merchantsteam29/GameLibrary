<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#7c3bff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14093d" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="240" rx="108" fill="#fff" opacity=".07"/>
  <!-- stacked game cards -->
  <g filter="url(#sh)">
    <rect x="150" y="92" width="212" height="300" rx="28" fill="#fff" opacity=".35" transform="rotate(-14 256 256)"/>
    <rect x="150" y="92" width="212" height="300" rx="28" fill="#fff" opacity=".55" transform="rotate(8 256 256)"/>
    <rect x="150" y="106" width="212" height="300" rx="28" fill="url(#card)"/>
  </g>
  <!-- play button -->
  <circle cx="256" cy="256" r="74" fill="url(#bg)"/>
  <path d="M232 214 L232 298 L300 256 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  <rect x="190" y="356" width="132" height="12" rx="6" fill="#7c5bff" opacity=".35"/>
</svg>
