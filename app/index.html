<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
<title>Game Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img class="logo" src="../build/icon.png" alt=""> Game Library</div>
    <input id="search" type="search" placeholder="Search games…" autocomplete="off">
    <select id="sort" title="Sort">
      <option value="recent">Recently played</option>
      <option value="az">A – Z</option>
      <option value="added">Newest added</option>
    </select>
    <button id="addBtn" class="ghost desktop-only" title="Add a game folder">＋ Add game</button>
    <button id="rescanBtn" class="ghost desktop-only" title="Look for new games in your repos folder">⟳</button>
  </header>

  <main id="grid-view">
    <section id="grid" class="grid"></section>
    <p id="empty" class="empty" hidden>No games yet. Hit <b>＋ Add game</b> and pick a folder with an <code>index.html</code>.</p>
  </main>

  <main id="detail-view" hidden>
    <div class="hero">
      <div class="hero-bg" id="d-bg"></div>
      <button id="back" class="back">← Library</button>
      <div class="hero-inner">
        <div class="hero-thumb" id="d-thumb"></div>
        <div class="hero-text">
          <h1 id="d-title"></h1>
          <p id="d-desc"></p>
          <div class="stats" id="d-stats"></div>
          <div class="actions">
            <button id="d-play" class="play">▶ Play</button>
            <button id="d-fav" class="ghost" title="Favourite">☆</button>
          </div>
          <p class="hint desktop-only">In game: <kbd>F11</kbd> fullscreen · <kbd>F5</kbd> reload · <kbd>F12</kbd> dev tools</p>
        </div>
      </div>
    </div>
    <div class="manage desktop-only">
      <h2>Manage</h2>
      <div class="row">
        <button id="d-snap" class="ghost">📸 Use current game screen as thumbnail</button>
        <button id="d-pick" class="ghost">🖼 Pick thumbnail image…</button>
        <button id="d-rename" class="ghost">✎ Rename</button>
        <button id="d-folder" class="ghost">📁 Open folder</button>
        <button id="d-remove" class="ghost danger">Remove from library</button>
      </div>
      <p class="path" id="d-path"></p>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="web.js"></script>
  <script src="app.js"></script>
</body>
</html>
